apiVersion: v1
kind: Pod
metadata:
  name: hardened-pod
  labels:
    app: hardened-pod
spec:
  securityContext:
    fsGroup: 101

  containers:
    - name: hardened-container
      image: nginxinc/nginx-unprivileged:alpine

      ports:
        - containerPort: 8080

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"

      volumeMounts:
        - name: nginx-tmp
          mountPath: /tmp

  volumes:
    - name: nginx-tmp
      emptyDir: {}
